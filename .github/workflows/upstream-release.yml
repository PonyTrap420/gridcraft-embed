name: Upstream release
on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'rust/**'
      - 'scripts/**'
      - 'test/**'
      - 'dist/*.js'
      - 'dist/*.ts'
      - 'package*.json'
      - 'upstream-state.json'
      - '.github/workflows/upstream-release.yml'
  repository_dispatch:
    types: [upstream-release]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Validate the current version even if upstream has not changed
        type: boolean
        default: false
      retry_failed:
        description: Retry an unchanged upstream candidate that previously failed validation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: upstream-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      update: ${{ steps.plan.outputs.update }}
      build: ${{ steps.plan.outputs.build }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        name: Select candidate and check previous validation failures
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
        run: node scripts/plan-release.mjs
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.build == 'true'
        with:
          name: candidate-plan
          include-hidden-files: true
          if-no-files-found: error
          path: .work/release-plan.json
  build:
    name: Validate candidate
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      failure_stage: ${{ steps.classify.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: candidate-plan
          path: .work
      - name: Check publishing is configured
        if: needs.plan.outputs.changed == 'true'
        env:
          ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: test "$ENABLED" = true || { echo 'Configure npm trusted publishing, then set NPM_PUBLISH_ENABLED=true'; exit 1; }
      - id: update
        name: Prepare isolated upstream candidate
        if: needs.plan.outputs.update == 'true'
        run: node scripts/update-upstream.mjs
      - name: Install dependencies
        run: npm ci
      - id: source
        name: Fetch pinned source, apply UI hooks and install embedding crate
        run: node scripts/prepare-upstream.mjs
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            .work/upstream/target
          key: embed-crate-${{ runner.os }}-${{ hashFiles('.work/upstream/Cargo.lock') }}
      - name: Install matching wasm-bindgen
        run: node scripts/install-bindgen.mjs
      - name: Fetch locked dependencies
        run: cargo +1.95.0 fetch --manifest-path .work/upstream/Cargo.toml --target wasm32-unknown-unknown --locked
      - id: compile
        name: Compile candidate browser runtime
        env:
          CARGO_NET_OFFLINE: 'true'
        run: node scripts/build-wasm.mjs --runtime-only
      - id: licenses
        name: Collect candidate dependency licenses
        run: node scripts/collect-licenses.mjs
      - id: tests
        name: Test adapters and production bundle
        run: |
          npm run test:isolation
          npm test
          npm run demo:build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - id: browser
        name: Test actual spreadsheet in Chromium
        env:
          DEMO_URL: http://127.0.0.1:5173
          CHROME_PATH: ''
          ARTIFACT_DIR: screenshots
        run: |
          npm run dev > .work/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$DEMO_URL" >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Pack validated candidate and record artifact checksums
        run: |
          npm pack --pack-destination .work
          tar --exclude=.git --exclude=.work --exclude=node_modules --exclude=dist/wasm --exclude=dist/notices --exclude=demo/dist --exclude=screenshots -czf .work/source.tar.gz .
          node scripts/validate-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .work/*.tgz
            .work/source.tar.gz
            .work/validated-candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: screenshots/
      - id: classify
        name: Distinguish compatibility failures from infrastructure failures
        if: failure()
        env:
          COMPILE: ${{ steps.compile.outcome }}
          LICENSES: ${{ steps.licenses.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: node scripts/classify-candidate.mjs
  record_failure:
    needs: [plan, build]
    if: always() && needs.plan.outputs.changed == 'true' && needs.build.result == 'failure' && needs.build.outputs.failure_stage != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-plan
          path: .work
      - name: Record failed candidate without changing the published source pin
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_STAGE: ${{ needs.build.outputs.failure_stage }}
        run: node scripts/record-candidate.mjs
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: .work/artifacts
      - name: Restore tested source
        run: tar -xzf .work/artifacts/source.tar.gz
      - name: Verify validated artifacts, publish to npm and confirm release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
